<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pink Baroness | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'berkshire swash', sans-serif;
        }

        /* Top Left Logo */
        .top-left-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px;
            z-index: 100;
        }

        /* Vertical Sidebar */
        .vertical-sidebar {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 400px;
            background-color: #fce4ec;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .vertical-sidebar h2 {
            transform: rotate(-90deg);
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin: 0;
        }

        /* Navigation */
        nav {
            position: absolute;
            top: 40px;
            right: 50px;
            display: flex;
            gap: 30px;
            align-items: center;
            z-index: 20;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-family: 'berkshire swash', serif;
            font-weight: bold;
            padding: 8px 15px;
        }

        .active-tab {
            background-color: #fce4ec;
            border-radius: 5px;
        }

        /* Hero Layout */
        .hero-section {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
        }

        .floral-column {
            width: 30%;
            height: 100vh;
            background-image: url('floral-bg.png'); /* ENSURE THIS IS UPLOADED */
            background-size: cover;
            background-position: center;
            position: relative;
            margin-left: 150px;
        }

        .anime-character {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: auto;
        }

        .center-logo {
            flex-grow: 1;
            display: flex;
            justify-content: center;
        }

        .center-logo img {
            width: 500px;
        }

        .cart { width: 40px; }
    </style>
</head>
<body>

    <!-- This will show at the top left -->
    <img src="main-logo.png" class="top-left-logo" alt="Logo">

    <nav>
        <a href="#" class="active-tab">home</a>
        <a href="#">about us</a>
        <a href="#">categories</a>
        <img src="cart-icon.png" class="cart" alt="cart">
    </nav>

    <div class="vertical-sidebar">
        <h2>home</h2>
    </div>

    <div class="hero-section">
        <div class="floral-column">
            <img src="character-main.png" class="anime-character" alt="Character">
        </div>

        <div class="center-logo">
            <img src="main-logo.png" alt="Main Logo">
        </div>
    </div>

</body>
</html>
