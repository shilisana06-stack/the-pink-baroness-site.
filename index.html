<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pink Baroness | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --baroness-pink: #ff69b4;
            --soft-pink: #fce4ec;
            --dark-text: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Disables scrolling */
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        /* Fixed Vertical Sidebar */
        .vertical-sidebar {
            position: fixed;
            left: 50px;
            top: 230px;
            width: 80px;
            height: 400px;
            background-color: var(--soft-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .vertical-sidebar h2 {
            transform: rotate(-90deg);
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin: 0;
            color: var(--dark-text);
        }

        /* Top Navigation */
        nav {
            position: absolute;
            top: 40px;
            right: 150px;
            display: flex;
            gap: 50px;
            align-items: center;
            z-index: 20;
        }

        nav a {
            text-decoration: none;
            color: var(--dark-text);
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 5px 15px;
            transition: 0.3s;
        }

        nav a:hover, nav a.active {
            background-color: var(--soft-pink);
            border-radius: 5px;
        }

        /* Layered Content Containers */
        .hero-container {
            display: flex;
            height: 100vh;
            align-items: center;
            padding-left: 200px;
            gap: 50px;
        }

        .floral-layer {
            width: 300px;
            height: 600px;
            background-image: url('floral-bg.png'); /* Use your image here */
            background-size: cover;
            position: relative;
            animation: fadeIn 3s ease-in;
        }

        .anime-character {
            position: absolute;
            bottom: -20px;
            left: 50px;
            width: 350px;
            animation: fadeIn 4s ease-in;
        }

        .logo-reveal {
            max-width: 500px;
            animation: fadeIn 2.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cart-icon { width: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="active">home</a>
        <a href="#">about us</a>
        <a href="#">categories</a>
        <img src="cart-icon.png" class="cart-icon" alt="purchases">
    </nav>

    <div class="vertical-sidebar">
        <h2>home</h2>
    </div>

    <div class="hero-container">
        <!-- Floral and Character Stack -->
        <div class="floral-layer">
            <!-- Ensure your character image is a PNG with a transparent background -->
            <img src="character-main.png" alt="The Pink Baroness">
        </div>

        <!-- Main Logo Section -->
        <div class="logo-reveal">
            <img src="main-logo.png" alt="The Pink Baroness Journal">
        </div>
    </div>

</body>
</html>
