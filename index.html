<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pink Baroness | Home</title>
    <style>
        @font-face {
            font-family: 'MyLocalBerkshire';
            src: url('BerkshireSwash-Regular.ttf');
        }

        body, html {
            margin: 0; padding: 0;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden; 
            overflow-y: auto;
            background-color: #f8e9e9;
            /* Applying Berkshire Swash globally */
            font-family: 'MyLocalBerkshire', cursive;
        }

        /* Top Left Logo */
        .top-left-logo {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 200px;
            z-index: 100;
        }

        /* Vertical Sidebar */
        .vertical-sidebar {
            position: fixed;
            left: 100px;
            top: 402px;
            width: 200px;
            height: 678px;
            background-color: #ffd6d6;
            display: flex;
            align-items: center;    /* Centering horizontally */
            justify-content: center; /* Centering vertically */
            z-index: 10;
        }

        .vertical-sidebar h2 {
            /* Rotated 90 degrees and sized to 80px */
            transform: rotate(-90deg);
            font-family: 'MyLocalBerkshire', cursive;
            font-size: 80px; 
            margin: 0;
            white-space: nowrap;
            color: black;
            font-weight: normal;
        }

        /* Responsive Navigation */
        nav {
            position: absolute;
            top: 100px;
            right: 5%;
            display: flex;
            align-items: center;
            z-index: 20;
        }

        nav a {
            width: 250px; /* Increased width to accommodate larger text */
            text-align: center;
            text-decoration: none;
            color: black;
            font-family: 'MyLocalBerkshire', cursive;
            /* Top text size set to 30px */
            font-size: 30px;
            font-weight: normal;
        }

        .active-tab {
            background-color: #ffd6d6;
            border-radius: 5px;
            padding: 5px 15px;
        }

        /* Responsive Center Logo */
        .center-logo-container {
            position: absolute;
            left: 60%; 
            top: 45%;
            transform: translate(-50%, -50%); 
            width: 30%; 
            max-width: 550px; 
            z-index: 15;
            animation: fadeIn 2.5s ease-in;
        }

        .center-logo-container img {
            width: 100%;
            height: auto;
        }

        ..hero-section {
    position: relative; /* Changed from flex to relative */
    height: 100vh;
    width: 100vw;
}

.floral-column {
    position: absolute;
    top: 0;
    /* Workspace Math: Sidebar(100px) + Sidebar Width(200px) + Gap(100px) = 400px */
    left: 400px; 
    width: 400px;
    height: 100vh;
    background-image: url('floral-bg.png');
    background-size: cover;
    background-position: center;
    z-index: 5;
}

.anime-character {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: auto;
    max-height: 80vh;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

        .cart { width: 50px; margin-left: 20px; }
    </style>
</head>
<body>

    <img src="main-logo.png" class="top-left-logo" alt="Logo">

    <nav>
        <a href="#" class="active-tab">home</a>
        <a href="#">about us</a>
        <a href="#">categories</a>
        <img src="cart-icon.png" class="cart" alt="cart">
    </nav>

    <div class="vertical-sidebar">
        <h2>home</h2>
    </div>

    <div class="hero-section">
        <div class="floral-column">
            <img src="character-main.png" class="anime-character" alt="Character">
        </div>

        <div class="center-logo-container">
            <img src="center-logo.png" alt="Main Brand Logo">
        </div>
    </div>

</body>
</html>
