<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pink Baroness | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            background-color: #f8e9e9;
            font-family: 'berkshire swash', sans-serif;
        }

        /* Top Left Logo */
        .top-left-logo {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 200px;
            z-index: 100;
        }

        /* Vertical Sidebar */
        .vertical-sidebar {
            position: fixed;
            left: 100px;
            top: 402px;
            transform: translateY(-50%);
            width: 200px;
            height: 678px;
            background-color: #ffd6d6;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .vertical-sidebar h2 {
            transform: rotate(-90deg);
            font-family: 'berkshire swash', sans-serif;
            font-size: 3rem;
            margin: 0;
        }
nav {
    position: absolute;
    top: 100px; /* Starts 100px from the top */
    left: 1000px; /* Starts 1000px from the left */
    display: flex;
    align-items: center;
    /* We remove 'gap' because we are using fixed widths instead */
}

nav a, .cart-wrapper {
    width: 200px; /* Each item gets exactly 200px of space */
    text-align: center; /* This centers the text inside that 200px space */
    text-decoration: none;
    color: black;
    font-family: berkshire swash', sans-serif;
    font-weight: bold;
    display: inline-block;
}

/* Specific styling for the active 'home' tab */
.active-tab {
    background-color: #ffd6d6;
    border-radius: 5px;
    padding: 10px 0; /* Padding inside its 200px space */
        }
.cart {
    width: 40px;
    display: block;
    margin: 0 auto; /* Centers the icon inside the 1600-1800px zone */
}
        /* Hero Layout */
        .hero-section {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
        }

        .floral-column {
            top: 0px; /* Starts 100px from the top */
    left: 401px
            width: 400px;
            height: 100vh;
            background-image: url('floral-bg.png'); /* ENSURE THIS IS UPLOADED */
            background-size: cover;
            background-position: center;
            position: relative;
            margin-left: 100px;
        }

        .anime-character {
            position: absolute;
            bottom: 0;
            left: 500px;
            transform: translateX(-50%);
            width: 394px;
            height: 402px;
        }

        .center-logo-container {
    position: absolute;
    left: 1110px; /* Your exact horizontal coordinate */
    top: 900px;  /* Your exact vertical coordinate */
    width: 550px; /* Your exact width requirement */
    z-index: 15;  /* Sits in front of the background but behind the navigation */
    animation: fadeIn 2.5s ease-in;
}

.center-logo-container img {
    width: 100%; /* Fills the 550px container perfectly */
    height: auto;
        }

        .cart { width: 40px; }
    </style>
</head>
<body>

    <!-- This will show at the top left -->
    <img src="main-logo.png" class="top-left-logo" alt="Logo">

    <nav>
        <a href="#" class="active-tab">home</a>
        <a href="#">about us</a>
        <a href="#">categories</a>
        <img src="cart-icon.png" class="cart" alt="cart">
    </nav>

    <div class="vertical-sidebar">
        <h2>home</h2>
    </div>

    <div class="hero-section">
        <div class="floral-column">
            <img src="character-main.png" class="anime-character" alt="Character">
        </div>

       <div class="center-logo-container"><img src="center-logo.png" alt="Main Brand Logo">
        </div>
    </div>

</body>
</html>
