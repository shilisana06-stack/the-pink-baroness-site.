<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pink Baroness | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --baroness-pink: #ff69b4;
            --soft-pink: #fce4ec;
            --dark-text: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Disables scrolling */
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        /* Top Left Brand Logo */
        .top-left-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 180px;
            z-index: 100;
        }

        /* Fixed Vertical Sidebar */
        .vertical-sidebar {
            position: fixed;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            width: 100px;
            height: 450px;
            background-color: var(--soft-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .vertical-sidebar h2 {
            transform: rotate(-90deg);
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin: 0;
            color: var(--dark-text);
        }

        /* Top Navigation */
        nav {
            position: absolute;
            top: 40px;
            right: 80px;
            display: flex;
            gap: 40px;
            align-items: center;
            z-index: 20;
        }

        nav a {
            text-decoration: none;
            color: var(--dark-text);
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 8px 15px;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: var(--soft-pink);
            border-radius: 5px;
        }

        /* FULL HEIGHT Floral Layer */
        .hero-section {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
        }

        .floral-column {
            width: 25%; /* Takes up 1/4 of the screen width */
            height: 100vh; /* Top to bottom */
            background-image: url('floral-bg.png');
            background-size: cover;
            background-position: center;
            position: relative;
            margin-left: 200px; /* Space for sidebar */
            animation: fadeIn 3s ease-in;
        }

        .anime-character {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 110%; /* Stretches character slightly outside the floral box */
            height: auto;
            animation: fadeIn 4s ease-in;
        }

        /* Main Center Logo */
        .center-logo-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            animation: fadeIn 2.5s ease-in;
        }

        .center-logo-container img {
            width: 600px; /* Larger logo */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cart-icon { width: 45px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TOP LEFT LOGO -->
    <img src="top-left-logo.png" class="top-left-logo" alt="The Pink Baroness Logo">

    <nav>
        <a href="#" style="background-color: var(--soft-pink); border-radius: 5px;">home</a>
        <a href="#">about us</a>
        <a href="#">categories</a>
        <img src="cart-icon.png" class="cart-icon" alt="purchases">
    </nav>

    <div class="vertical-sidebar">
        <h2>home</h2>
    </div>

    <div class="hero-section">
        <div class="floral-column">
            <img src="character-main.png" class="anime-character" alt="Character">
        </div>

        <div class="center-logo-container">
            <img src="main-logo.png" alt="The Pink Baroness Journal">
        </div>
    </div>

</body>
</html>
