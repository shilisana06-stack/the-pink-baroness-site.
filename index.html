<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pink Baroness | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --baroness-pink: #ff69b4;
            --soft-pink: #fce4ec;
            --dark-text: #1a1a1a;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'berkshire swash', sans-serif;
        }

        /* Top Left Brand Logo - Fixed size and position */
        .top-left-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px; /* Controlled size */
            height: auto;
            z-index: 100;
        }

        /* Fixed Vertical Sidebar */
        .vertical-sidebar {
            position: fixed;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            width: 90px;
            height: 450px;
            background-color: var(--soft-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .vertical-sidebar h2 {
            transform: rotate(-90deg);
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin: 0;
            color: var(--dark-text);
        }

        nav {
            position: absolute;
            top: 40px;
            right: 80px;
            display: flex;
            gap: 40px;
            align-items: center;
            z-index: 20;
        }

        nav a {
            text-decoration: none;
            color: var(--dark-text);
            font-family: 'berkshire swash', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 8px 15px;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: var(--soft-pink);
            border-radius: 5px;
        }

        .hero-section {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
        }

        .floral-column {
            width: 25%;
            height: 100vh;
            background-image: url('floral-bg.png');
            background-size: cover;
            background-position: center;
            position: relative;
            margin-left: 180px;
            animation: fadeIn 3s ease-in;
        }

        /* Character Size Adjustment */
        .anime-character {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%); /* Centers her in the column */
            width: 85%; /* Reduced size so she fits elegantly */
            height: auto;
            animation: fadeIn 4s ease-in;
        }

        .center-logo-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            animation: fadeIn 2.5s ease-in;
        }

        .center-logo-container img {
            width: 500px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cart-icon { width: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Using main-logo.png for both since you said they are the same -->
    <img src="main-logo.png" class="top-left-logo" alt="The Pink Baroness Logo">

    <nav>
        <a href="#" style="background-color: var(--soft-pink); border-radius: 5px;">home</a>
        <a href="#">about us</a>
        <a href="#">categories</a>
        <img src="cart-icon.png" class="cart-icon" alt="purchases">
    </nav>

    <div class="vertical-sidebar">
        <h2>home</h2>
    </div>

    <div class="hero-section">
        <div class="floral-column">
            <img src="character-main.png" class="anime-character" alt="Character">
        </div>

        <div class="center-logo-container">
            <img src="main-logo.png" alt="The Pink Baroness Journal">
        </div>
    </div>

</body>
</html>
